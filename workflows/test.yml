name: Engine Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Run Algorithm & Predictor Validation
      run: |
        node -e '
        const PHI = 1.618033988749895;
        const NODES = 121;
        console.log("Running headless engine validation...");
        
        // Quick assertion check matching TestEngine
        const weights = Array.from({ length: NODES }, (_, i) => Math.abs(Math.sin((i + 1) * PHI)) * (1.0 - i / NODES));
        if (weights.length === 121 && weights[0] > 0) {
            console.log("✅ Phi-Grid weight matrix generated successfully.");
            process.exit(0);
        } else {
            console.error("❌ Grid generation failed.");
            process.exit(1);
        }
        '
